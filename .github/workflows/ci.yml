name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and verify app
        run: ./build.sh "$RUNNER_TEMP/ComfyDraw-CI.app"
      - name: Run isolated mock-backend tests
        run: python3 tests/run_tests.py
